services:
  - type: web
    name: weathergpt
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you set this manually in the Render dashboard
      - key: DATABASE_URL
        sync: false          # you set this manually in the Render dashboard
      - key: WEATHERAPI_KEY
        sync: false          # optional fallback weather provider
      - key: APP_NAME
        value: WeatherGPT
      - key: DEBUG
        value: "false"
